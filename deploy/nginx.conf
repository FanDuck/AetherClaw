# ============================================================================
# AetherClaw (灵爪) - Official Nginx HTTPS/TLS Reverse Proxy Configuration
# ============================================================================
# 生产环境最佳实践：
#   1. AetherClaw 仅监听 127.0.0.1:3721 (HOST=127.0.0.1, BEHIND_TLS_PROXY=true, AETHERCLAW_TOKEN=...)
#   2. Nginx 负责公网 443 TLS 1.2/1.3 加密卸载，并将 80 端口强制重定向至 HTTPS
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name agent.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.example.com;

    ssl_certificate     /etc/letsencrypt/live/agent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3721;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 关键配置：关闭代理缓冲，确保 SSE (/api/chat/stream) Token 级流式输出无延迟
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
