name: Cross-Platform CI (Windows & Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 最小权限：CI 只需要读取代码
permissions:
  contents: read

# 同一分支连续推送时，取消旧的运行，节省 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (all source files)
        shell: bash
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done

      - name: Run Cross-Platform Test Suite
        run: npm test

      - name: CLI smoke test (--version / --help)
        run: |
          node bin/aetherclaw.js --version
          node bin/aetherclaw.js --help
